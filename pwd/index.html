  <meta name="description" content="Deterministic passwords from one passphrase. Nothing leaves this device.">
  <title>Password Generator</title>
  <script>
    (function () {
      function isIosDevice() {
        return /iphone|ipad|ipod/i.test(window.navigator.userAgent);
      }
      function isPwaStandalone() {
        return window.matchMedia("(display-mode: standalone)").matches
          || window.navigator.standalone === true;
      }
      function isIosStandalone() {
        if (!isIosDevice()) return false;
        return isPwaStandalone();
      }
      function readHeight() {
        if (isIosStandalone()) return Math.round(window.innerHeight);
        var viewport = window.visualViewport;
        return Math.round(viewport && viewport.height > 0 ? viewport.height : window.innerHeight);
      }
      function syncViewportHeight() {
        var root = document.documentElement;
        root.classList.toggle("ios-standalone", isIosStandalone());
        root.classList.toggle("pwa-standalone", isPwaStandalone());
        root.style.setProperty("--viewport-height", readHeight() + "px");
      }
      function syncAfterOrientation() {
        syncViewportHeight();
        setTimeout(syncViewportHeight, 100);
        setTimeout(syncViewportHeight, 300);
      }
      if (isPwaStandalone()) document.documentElement.classList.add("pwa-standalone");
      if (isIosStandalone()) document.documentElement.classList.add("ios-standalone");
      syncViewportHeight();
      window.addEventListener("resize", syncViewportHeight);
      window.addEventListener("orientationchange", syncAfterOrientation);
      window.addEventListener("pageshow", syncViewportHeight);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", syncViewportHeight);
        window.visualViewport.addEventListener("scroll", syncViewportHeight);
      }
    })();
  </script>

<body>
  <main>
    <form id="form" autocomplete="off" data-lpignore="true" data-1p-ignore data-bwignore>
      <div class="phrase-head">
        <label class="lbl" for="phrase">Passphrase</label>
        <label class="remember-toggle" for="remember">
          <span>Remember</span>
          <input
            id="remember"
            type="checkbox"
            role="switch"
            aria-label="Remember passphrase on this device"
          >
        </label>
      </div>
      <div class="field">
        <input
          id="phrase"
          class="phrase-secret"
          type="text"
          inputmode="text"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          enterkeyhint="next"
          placeholder="Long memorable phrase"
          data-form-type="other"
          data-1p-ignore
          data-lpignore="true"
          data-bwignore
          readonly
        >
      </div>

      <label class="lbl site-label" for="site">Site</label>
      <div class="field field-site" id="site-field">
        <div class="field-site-input-wrap">
          <input
            id="site"
            type="text"
            role="combobox"
            aria-autocomplete="list"
            aria-expanded="false"
            aria-controls="menu-list"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            enterkeyhint="go"
            placeholder="Name or URL"
            data-1p-ignore
            data-lpignore="true"
          >
          <button
            class="site-clear"
            id="site-clear"
            type="button"
            hidden
            aria-label="Clear site"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
              <path d="M9.2 9.2l5.6 5.6M14.8 9.2l-5.6 5.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
            </svg>
          </button>
        </div>
        <p class="menu-label" id="menu-label" hidden></p>
        <ul class="menu-list" id="menu-list" role="listbox"></ul>
      </div>
      <p class="error" id="error" hidden></p>
    </form>

    <div class="result" id="result" hidden>
      <p class="password" id="password" translate="no"></p>
      <button class="copy-btn" id="copy" type="button" aria-label="Copy password">
        <span class="copy-btn__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <rect x="8.2" y="8.2" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
            <path d="M6.2 15.5V6.2A2 2 0 0 1 8.2 4.2h8.3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
          </svg>
        </span>
        <span class="copy-btn__done" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <defs>
              <linearGradient id="pwd-copy-grad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#8eb0ff"></stop>
                <stop offset="50%" stop-color="#d08cff"></stop>
                <stop offset="100%" stop-color="#8eb0ff"></stop>
                <animateTransform
                  attributeName="gradientTransform"
                  type="translate"
                  dur="2.2s"
                  repeatCount="indefinite"
                  calcMode="spline"
                  keyTimes="0;0.5;1"
                  keySplines="0.45 0 0.55 1;0.45 0 0.55 1"
                  values="-10 -10;10 10;-10 -10"
                ></animateTransform>
              </linearGradient>
            </defs>
            <path d="M5 12.5 9.5 17 19 7.5" fill="none" stroke="url(#pwd-copy-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          <span class="copy-btn__label">Copied!</span>
        </span>
      </button>
    </div>
  </main>
  <p class="fine">Nothing leaves this device.</p>
